[package]
name = "broadcom-usage"
version = "0.1.0"
edition.workspace = true
description = "Collects AI agent usage and answers BROADCOM's usage views"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1"
foldhash = "0.2"
form_urlencoded = "1"
indexmap = { version = "2", features = ["serde"] }
memchr = "2"
mimalloc = "0.1"
notify = "8"
postcard = { version = "1", features = ["use-std"] }
regex = "1"
reqwest = { workspace = true, features = ["rustls", "json", "gzip"] }
parking_lot = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = { version = "1", features = ["indexmap2"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip", "raw_value"] }
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[lints]
workspace = true
