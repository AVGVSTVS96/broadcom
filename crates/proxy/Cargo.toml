[package]
name = "broadcom-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "One address for all your Claude subscriptions: a Claude account pool for Claude Code"
repository.workspace = true
readme = "README.md"
keywords = ["claude", "anthropic", "claude-code", "proxy", "pool"]
categories = ["command-line-utilities", "web-programming::http-server"]
include = ["src/**", "config.example.json", "README.md", "DESIGN.md", "LICENSE"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
jiff = "0.2"
rand = "0.10"
reqwest = { workspace = true, features = ["default-tls", "charset", "http2", "system-proxy", "json", "stream", "form", "gzip", "brotli", "zstd"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
